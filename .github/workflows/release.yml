# Builds, signs and publishes the app when a version tag (e.g. v1.0.0) is pushed.
# Needs repository secrets SIGNING_P12 (base64 of the .p12) and SIGNING_P12_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build
        run: REQUIRE_SIGNING=1 VERSION="${GITHUB_REF_NAME#v}" SWIFT_FLAGS="--arch arm64 --arch x86_64" ./build.sh

      - name: Package
        run: ditto -c -k --keepParent "build/Quit on Close.app" "QuitOnClose-$GITHUB_REF_NAME.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "QuitOnClose-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
